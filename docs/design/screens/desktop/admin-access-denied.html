<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoomForge Admin — 접근 거부</title>
  <script>
    (function () { try { var s = localStorage.getItem('rf-theme');
      var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <script src="../../system/vendor/tailwind.js"></script>
  <script>
    tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'], theme: { extend: {
      colors: { page:'var(--page-bg)', surface:'var(--surface)', 'surface-hi':'var(--surface-hover)', panel:'var(--panel)', line:'var(--line-soft)', 'line-hi':'var(--line-strong)', ink:'var(--brand-ink)', main:'var(--text-main)', muted:'var(--text-muted)', dim:'var(--text-dim)', accent:'var(--accent)', admin:'var(--admin)' },
      fontFamily: { sans: ['var(--rf-sans)'] }, borderRadius: { card: '14px' } } } };
  </script>
  <style>
    :root[data-theme="dark"]{ --page-bg:#070608; --text-main:#f8f8f5; --text-muted:rgba(248,248,245,.66); --text-dim:rgba(248,248,245,.42); --brand-ink:#fff; --line-soft:rgba(214,226,236,.13); --line-strong:rgba(214,226,236,.30); --surface:rgba(255,255,255,.04); --surface-hover:rgba(255,255,255,.09); --panel:rgba(255,255,255,.03); --accent:#8fb4ff; --admin:#a78bfa; --bar-bg:rgba(12,9,16,.82); --grid-tint:rgba(180,160,235,.05); --grid-tint-soft:rgba(180,160,235,.04); --grid-opacity:.5; }
    :root[data-theme="light"]{ --page-bg:#eceae8; --text-main:#15171c; --text-muted:rgba(21,23,28,.66); --text-dim:rgba(21,23,28,.46); --brand-ink:#0a0c10; --line-soft:rgba(20,30,45,.12); --line-strong:rgba(20,30,45,.26); --surface:rgba(15,20,30,.045); --surface-hover:rgba(15,20,30,.09); --panel:rgba(255,255,255,.6); --accent:#3f6ad8; --admin:#7c5cd6; --bar-bg:rgba(243,240,247,.82); --grid-tint:rgba(120,92,214,.06); --grid-tint-soft:rgba(120,92,214,.045); --grid-opacity:.4; }
    * { box-sizing: border-box; } html, body { height: 100%; }
    html,body{ font-family:var(--rf-sans); } body{ margin:0; background:var(--page-bg); color:var(--text-main); overflow:hidden; transition:background-color .6s ease,color .6s ease; }
    body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none; background: radial-gradient(120% 80% at 50% 0%, rgba(167,139,250,.10), transparent 55%), repeating-linear-gradient(90deg, var(--grid-tint) 0 1px, transparent 1px 92px), repeating-linear-gradient(180deg, var(--grid-tint-soft) 0 1px, transparent 1px 92px); opacity:var(--grid-opacity); }
    .theme-toggle{ position:relative; width:38px; height:38px; border-radius:10px; overflow:hidden; } .theme-toggle::after{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 36%, transparent 42%, rgba(0,0,0,.28)); }
    .theme-toggle .dial{ position:absolute; left:50%; top:50%; width:16px; height:46px; transform:translate(-50%,-50%) rotate(0deg); transform-origin:50% 50%; } .theme-toggle .body{ position:absolute; left:50%; width:15px; height:15px; border-radius:50%; transform:translateX(-50%); }
    .theme-toggle .sun{ top:0; background:radial-gradient(circle at 50% 45%, #ffe9b0, #ffb347 70%); } .theme-toggle .moon{ bottom:0; background:radial-gradient(circle at 36% 34%, #f2f5ff, #b6c2e0 72%); }
    .btn-primary{ background:var(--rf-grad-primary); color:#050505; }
    @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
    .card{ animation: rise .5s var(--rf-ease-out) both; }
    @media (prefers-reduced-motion: reduce){ .theme-toggle .dial{ transition:none; } .card{ animation:none; } }
  </style>
</head>
<body>
  <div class="relative z-[1] min-h-screen flex flex-col">
    <!-- minimal top bar -->
    <header class="h-14 flex items-center gap-3 px-5 border-b border-line" style="background:var(--bar-bg);">
      <a href="../../landing.html" class="flex items-center gap-2 font-extrabold text-[13px] uppercase tracking-tight text-main"><span class="w-4 h-4 rounded-[5px]" style="background:linear-gradient(135deg,#a78bfa,#8fb4ff); box-shadow:var(--rf-ring-inset);"></span> RoomForge</a>
      <span class="inline-flex items-center gap-1.5 h-6 px-2.5 rounded-md text-[11px] font-extrabold tracking-wide" style="background:rgba(167,139,250,.16); color:var(--admin); border:1px solid rgba(167,139,250,.4)"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>ADMIN</span>
      <div class="ml-auto flex items-center gap-2">
        <button class="theme-toggle border border-line bg-surface hover:bg-surface-hi transition-colors" id="themeToggle" type="button" aria-label="낮/밤 테마 전환"><span class="dial" aria-hidden="true"><span class="body sun"></span><span class="body moon"></span></span></button>
        <button class="w-9 h-9 rounded-full grid place-items-center text-[12px] font-extrabold text-white" style="background:linear-gradient(135deg,#8fb4ff,#80c7c2);">JD</button>
      </div>
    </header>

    <!-- centered guard result -->
    <main class="flex-1 grid place-items-center px-5">
      <div class="card w-full max-w-[460px] text-center">
        <span class="inline-grid place-items-center w-16 h-16 rounded-2xl border" style="background:rgba(167,139,250,.12); border-color:rgba(167,139,250,.34); color:var(--admin)">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3M12 15v2"/></svg>
        </span>
        <h1 class="mt-5 text-[24px] font-extrabold text-ink">관리자 권한이 없습니다</h1>
        <p class="mt-2.5 text-[14px] text-muted leading-relaxed">이 페이지는 RoomForge 운영 관리자만 접근할 수 있어요.<br>현재 계정에는 관리자 역할이 부여되어 있지 않습니다.</p>

        <div class="mt-5 inline-flex items-center gap-2.5 h-11 px-3.5 rounded-xl border border-line" style="background:var(--panel)">
          <span class="w-7 h-7 rounded-full grid place-items-center text-[11px] font-extrabold text-white" style="background:linear-gradient(135deg,#8fb4ff,#80c7c2)">JD</span>
          <span class="text-left"><span class="block text-[12.5px] font-bold text-main leading-none">john@doe.com</span><span class="block text-[11px] text-dim mt-1">역할: 일반 사용자</span></span>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-2">
          <a href="projects.html" class="btn-primary inline-flex items-center justify-center gap-1.5 h-11 px-4 rounded-lg border text-sm font-bold w-full sm:w-auto" style="border-color:rgba(220,232,255,.86)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> 제품으로 돌아가기</a>
          <a href="#" class="inline-flex items-center justify-center gap-1.5 h-11 px-4 rounded-lg border border-line bg-surface text-sm font-bold text-main hover:bg-surface-hi transition-colors w-full sm:w-auto">관리자 권한 요청</a>
        </div>

        <p class="mt-6 text-[12px] text-dim flex items-center justify-center gap-1.5"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--admin)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 이 접근 시도는 감사 로그에 기록되었습니다.</p>
      </div>
    </main>
  </div>
  <script>
  (function () {
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches, root=document.documentElement, KEY='rf-theme';
    var saved=(function(){try{return localStorage.getItem(KEY);}catch(e){return null;}})(); var manual=saved!==null;
    var theme=saved||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); var curP=theme==='dark'?1:0;
    var toggle=document.getElementById('themeToggle'), dial=toggle.querySelector('.dial');
    function render(p){curP=p; dial.style.transform='translate(-50%,-50%) rotate('+(p*180).toFixed(2)+'deg)';}
    function setPage(d){root.setAttribute('data-theme', d?'dark':'light');}
    function animate(toDark){ var to=toDark?1:0, from=curP, start=performance.now(), dur=reduce?0:820, sw=false; var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}; if(!dur){render(to);setPage(toDark);return;} (function step(now){var k=Math.min(1,(now-start)/dur), e=from+(to-from)*ease(k); render(e); if(!sw&&((to>from&&e>=.5)||(to<from&&e<=.5))){setPage(toDark);sw=true;} if(k<1)requestAnimationFrame(step); else setPage(toDark);})(performance.now()); }
    toggle.setAttribute('aria-pressed', theme==='dark');
    toggle.addEventListener('click', function(){ manual=true; theme=theme==='dark'?'light':'dark'; try{localStorage.setItem(KEY,theme);}catch(e){} toggle.setAttribute('aria-pressed', theme==='dark'); animate(theme==='dark'); });
    var osq=window.matchMedia('(prefers-color-scheme: dark)'); var oh=function(e){ if(manual)return; theme=e.matches?'dark':'light'; animate(e.matches); }; if(osq.addEventListener)osq.addEventListener('change',oh); else if(osq.addListener)osq.addListener(oh);
    render(curP);
  })();
  </script>
</body>
</html>
