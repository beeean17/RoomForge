<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoomForge Admin — 작업 재시도</title>
  <script>
    (function () { try { var s = localStorage.getItem('rf-theme');
      var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <script src="../../system/vendor/tailwind.js"></script>
  <script>
    tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'], theme: { extend: {
      colors: { page:'var(--page-bg)', surface:'var(--surface)', 'surface-hi':'var(--surface-hover)', panel:'var(--panel)', line:'var(--line-soft)', 'line-hi':'var(--line-strong)', ink:'var(--brand-ink)', main:'var(--text-main)', muted:'var(--text-muted)', dim:'var(--text-dim)', accent:'var(--accent)', admin:'var(--admin)' },
      fontFamily: { sans: ['var(--rf-sans)'] }, borderRadius: { card: '14px' } } } };
  </script>
  <style>
    :root[data-theme="dark"]{ --page-bg:#070608; --text-main:#f8f8f5; --text-muted:rgba(248,248,245,.66); --text-dim:rgba(248,248,245,.42); --brand-ink:#fff; --line-soft:rgba(214,226,236,.13); --line-strong:rgba(214,226,236,.30); --surface:rgba(255,255,255,.04); --surface-hover:rgba(255,255,255,.09); --panel:rgba(255,255,255,.025); --accent:#8fb4ff; --admin:#a78bfa; --bar-bg:rgba(12,9,16,.82); --modal-bg:#100c16; }
    :root[data-theme="light"]{ --page-bg:#eceae8; --text-main:#15171c; --text-muted:rgba(21,23,28,.66); --text-dim:rgba(21,23,28,.46); --brand-ink:#0a0c10; --line-soft:rgba(20,30,45,.12); --line-strong:rgba(20,30,45,.26); --surface:rgba(15,20,30,.045); --surface-hover:rgba(15,20,30,.09); --panel:rgba(255,255,255,.55); --accent:#3f6ad8; --admin:#7c5cd6; --bar-bg:rgba(243,240,247,.82); --modal-bg:#fbfaff; }
    html,body{ font-family:var(--rf-sans); } body{ background:var(--page-bg); color:var(--text-main); }
    body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none; background: linear-gradient(180deg, rgba(167,139,250,.06), transparent 24%); opacity:.5; }
    .theme-toggle .dial{ position:absolute; left:50%; top:50%; width:16px; height:46px; transform:translate(-50%,-50%) rotate(0deg); transform-origin:50% 50%; }
    .theme-toggle .body{ position:absolute; left:50%; width:15px; height:15px; border-radius:50%; transform:translateX(-50%); }
    .theme-toggle .sun{ top:0; background:radial-gradient(circle at 50% 45%, #ffe9b0, #ffb347 70%); } .theme-toggle .moon{ bottom:0; background:radial-gradient(circle at 36% 34%, #f2f5ff, #b6c2e0 72%); }
    @keyframes modalIn{ from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;} }
    .modal{ animation:modalIn .26s var(--rf-ease-out) both; }
    @media (prefers-reduced-motion: reduce){ .modal{ animation:none; } }
  </style>
</head>
<body class="min-h-screen">
  <!-- dimmed admin/job-detail backdrop -->
  <div class="relative z-[1] pointer-events-none select-none" aria-hidden="true">
    <header class="fixed top-0 inset-x-0 z-30 h-14 flex items-center gap-3 px-4 border-b border-line" style="background:var(--bar-bg);">
      <span class="flex items-center gap-2 font-extrabold text-[13px] uppercase tracking-tight text-main"><span class="w-4 h-4 rounded-[5px]" style="background:linear-gradient(135deg,#a78bfa,#8fb4ff);"></span> RoomForge</span>
      <span class="inline-flex items-center gap-1.5 h-6 px-2.5 rounded-md text-[11px] font-extrabold" style="background:rgba(167,139,250,.16); color:var(--admin); border:1px solid rgba(167,139,250,.4)">ADMIN</span>
      <span class="ml-2 hidden md:flex items-center gap-1.5 text-[13px] text-dim">작업 › <span class="text-main font-semibold">#J-2058</span></span>
    </header>
    <aside class="fixed top-14 left-0 bottom-0 z-20 w-60 hidden lg:block border-r border-line px-3 py-3" style="background:var(--bar-bg);"><div class="h-9 rounded-lg bg-surface"></div><div class="h-9 mt-1 rounded-lg" style="background:rgba(167,139,250,.14)"></div><div class="h-9 mt-1 rounded-lg bg-surface"></div></aside>
    <main class="pt-14 lg:pl-60"><div class="mx-auto max-w-[1200px] px-7 py-7"><div class="h-9 w-44 rounded bg-surface"></div><div class="mt-6 grid lg:grid-cols-[1.6fr_1fr] gap-5"><div class="h-72 rounded-card border border-line" style="background:var(--panel)"></div><div class="h-72 rounded-card border border-line" style="background:var(--panel)"></div></div></div></main>
  </div>

  <!-- scrim + <RetryDialog/> -->
  <div class="scrim fixed inset-0 z-40" style="background:rgba(4,3,8,.64); backdrop-filter:blur(6px);"></div>
  <div class="fixed inset-0 z-50 grid place-items-center p-4 overflow-auto">
    <div class="modal w-full max-w-[540px] rounded-2xl border border-line-hi overflow-hidden shadow-2xl" style="background:var(--modal-bg);" role="dialog" aria-modal="true" aria-label="작업 재시도">
      <div class="flex items-center gap-3 px-6 h-16 border-b border-line">
        <span class="w-9 h-9 rounded-lg grid place-items-center" style="background:rgba(167,139,250,.16);color:var(--admin)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg></span>
        <div><h2 class="text-[17px] font-extrabold text-ink leading-none">작업 재시도</h2><p class="mt-1 text-[12px] text-dim tabular-nums">#J-2058 · 원룸 스튜디오</p></div>
        <a href="admin-job-detail.html" class="ml-auto grid place-items-center w-9 h-9 rounded-lg text-dim hover:text-main hover:bg-surface transition-colors" aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
      </div>

      <div class="px-6 py-5">
        <div class="rounded-xl border border-line p-3.5 flex items-start gap-2.5" style="background:var(--surface)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--admin)" stroke-width="2" class="shrink-0 mt-px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          <p class="text-[12.5px] text-muted leading-relaxed">원본 작업은 보존되고, <b class="text-main">연결된 재시도 작업</b>이 새로 큐에 등록됩니다. 실행 결과와 사유는 감사 로그에 기록됩니다.</p>
        </div>

        <p class="text-[12px] font-bold text-muted mt-5 mb-2">재시도 방식</p>
        <div class="flex flex-col gap-2">
          <label class="flex items-center gap-3 h-11 px-3.5 rounded-lg border cursor-pointer" style="border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.08)">
            <span class="w-4 h-4 rounded-full border-2 grid place-items-center" style="border-color:var(--admin)"><span class="w-2 h-2 rounded-full" style="background:var(--admin)"></span></span>
            <span class="text-[13px] font-semibold text-main">동일 설정으로 재시도</span>
            <span class="ml-auto text-[11px] text-dim">17장 · 기본 파라미터</span>
          </label>
          <label class="flex items-center gap-3 h-11 px-3.5 rounded-lg border border-line cursor-pointer hover:bg-surface transition-colors">
            <span class="w-4 h-4 rounded-full border-2 border-line"></span>
            <span class="text-[13px] font-semibold text-muted">설정 조정 후 재시도</span>
            <span class="ml-auto text-[11px] text-dim">이미지·품질 변경</span>
          </label>
        </div>

        <p class="text-[12px] font-bold text-muted mt-5 mb-2">관리자 사유 <span class="text-[#f0726a]">*</span></p>
        <textarea rows="2" placeholder="예: 정합 실패 — 겹침 부족 보완 후 재처리 요청" class="w-full rounded-lg border border-line bg-surface text-main text-[13px] px-3.5 py-2.5 outline-none focus:border-line-hi placeholder:text-dim resize-none"></textarea>
        <p class="mt-1.5 text-[11.5px] text-dim">감사 영수증(audit receipt)에 기록됩니다.</p>
      </div>

      <div class="flex items-center gap-2 px-6 h-16 border-t border-line">
        <span class="inline-flex items-center gap-1.5 text-[11.5px] text-dim"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Callable Function 권한 검증</span>
        <div class="ml-auto flex items-center gap-2">
          <a href="admin-job-detail.html" class="inline-flex items-center h-10 px-4 rounded-lg border border-line bg-surface text-sm font-bold text-main hover:bg-surface-hi transition-colors">취소</a>
          <button class="inline-flex items-center gap-1.5 h-10 px-5 rounded-lg text-sm font-bold text-white" style="background:var(--admin)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg>재시도 작업 생성</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') location.href = 'admin-job-detail.html'; });
    document.querySelector('.scrim').addEventListener('click', function () { location.href = 'admin-job-detail.html'; });
    (function(){ var p=(document.documentElement.getAttribute('data-theme')==='dark')?1:0; })();
  </script>
</body>
</html>
