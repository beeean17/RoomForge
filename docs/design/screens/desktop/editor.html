<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoomForge — 에디터</title>
  <script>
    (function () {
      try { var s = localStorage.getItem('rf-theme');
        var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <script src="../../system/vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: { extend: {
        colors: {
          page: 'var(--page-bg)', surface: 'var(--surface)', 'surface-hi': 'var(--surface-hover)',
          panel: 'var(--panel)', line: 'var(--line-soft)', 'line-hi': 'var(--line-strong)',
          ink: 'var(--brand-ink)', main: 'var(--text-main)', muted: 'var(--text-muted)', dim: 'var(--text-dim)', accent: 'var(--accent)',
        },
        fontFamily: { sans: ['var(--rf-sans)'] }, borderRadius: { card: '14px' },
      } },
    };
  </script>
  <style>
    :root[data-theme="dark"] {
      --page-bg:#050505; --text-main:#f8f8f5; --text-muted:rgba(248,248,245,.66); --text-dim:rgba(248,248,245,.42);
      --brand-ink:#fff; --line-soft:rgba(214,226,236,.13); --line-strong:rgba(214,226,236,.30);
      --surface:rgba(255,255,255,.04); --surface-hover:rgba(255,255,255,.09); --panel:rgba(255,255,255,.025);
      --accent:#8fb4ff; --bar-bg:rgba(10,10,12,.86); --canvas:#0a0b0d;
    }
    :root[data-theme="light"] {
      --page-bg:#ecebe4; --text-main:#15171c; --text-muted:rgba(21,23,28,.66); --text-dim:rgba(21,23,28,.46);
      --brand-ink:#0a0c10; --line-soft:rgba(20,30,45,.12); --line-strong:rgba(20,30,45,.26);
      --surface:rgba(15,20,30,.045); --surface-hover:rgba(15,20,30,.09); --panel:rgba(255,255,255,.6);
      --accent:#3f6ad8; --bar-bg:rgba(238,237,230,.92); --canvas:#1a1c20;
    }
    html, body { font-family: var(--rf-sans); height: 100%; }
    body { margin:0; background: var(--page-bg); color: var(--text-main); overflow: hidden; transition: background-color .6s ease, color .6s ease; }
    .btn-primary { background: var(--rf-grad-primary); color:#050505; border-color: rgba(220,232,255,.86); }
    .theme-toggle { position:relative; width:34px; height:34px; border-radius:9px; overflow:hidden; }
    .theme-toggle::after { content:""; position:absolute; inset:0; pointer-events:none; background: radial-gradient(circle at 50% 36%, transparent 42%, rgba(0,0,0,.28)); }
    .theme-toggle .dial { position:absolute; left:50%; top:50%; width:14px; height:42px; transform: translate(-50%,-50%) rotate(0deg); transform-origin:50% 50%; will-change:transform; }
    .theme-toggle .body { position:absolute; left:50%; width:13px; height:13px; border-radius:50%; transform: translateX(-50%); }
    .theme-toggle .sun { top:0; background: radial-gradient(circle at 50% 45%, #ffe9b0, #ffb347 70%); box-shadow:0 0 9px rgba(255,196,90,.85); }
    .theme-toggle .moon { bottom:0; background: radial-gradient(circle at 36% 34%, #f2f5ff, #b6c2e0 72%); box-shadow:0 0 7px rgba(180,196,232,.7); }
    .tool { display:grid; place-items:center; width:40px; height:40px; border-radius:10px; color:var(--text-dim); cursor:pointer; transition: background .15s, color .15s; }
    .tool:hover { background: var(--surface); color: var(--text-main); }
    .tool.active { background: rgba(143,180,255,.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(143,180,255,.4); }
    .fld { display:flex; align-items:center; gap:6px; height:32px; padding:0 9px; border:1px solid var(--line-soft); border-radius:8px; background:var(--surface); font-size:12.5px; color:var(--text-main); }
    .fld input { width:100%; background:transparent; border:0; outline:0; color:inherit; font:inherit; }
    .fld .u { color:var(--text-dim); font-size:11px; }
    @media (prefers-reduced-motion: reduce) { .theme-toggle .dial { transition:none; } }
  </style>
</head>

<body>
  <!-- ============================ <TopBar/> + <PipelineProgress current="editor"/> ============================ -->
  <header class="h-14 flex items-center gap-3 px-4 border-b border-line" style="background: var(--bar-bg);">
    <a href="../../landing.html" class="flex items-center gap-2 font-extrabold text-[13px] uppercase tracking-tight text-main shrink-0">
      <span class="w-4 h-4 rounded-[5px]" style="background: var(--rf-grad-brand); box-shadow: var(--rf-ring-inset);"></span> RoomForge
    </a>
    <nav class="ml-2 hidden md:flex items-center gap-1.5 text-[13px] text-dim shrink-0">
      <a href="projects.html" class="hover:text-main transition-colors">프로젝트</a>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      <a href="project.html" class="hover:text-main transition-colors">거실 리노베이션</a>
    </nav>
    <div id="pipeline" class="hidden xl:flex flex-1 items-center justify-center gap-1"></div>
    <div class="ml-auto flex items-center gap-2.5">
      <span class="hidden sm:inline-flex items-center gap-1.5 text-[12px] font-semibold text-dim"><span class="w-1.5 h-1.5 rounded-full" style="background:#48d39a"></span>모든 변경 저장됨</span>
      <button class="theme-toggle border border-line bg-surface hover:bg-surface-hi transition-colors" id="themeToggle" type="button" aria-label="낮/밤 테마 전환" aria-pressed="true"><span class="dial" aria-hidden="true"><span class="body sun"></span><span class="body moon"></span></span></button>
      <button class="w-8 h-8 rounded-full grid place-items-center text-[12px] font-extrabold text-white" style="background:linear-gradient(135deg,#8fb4ff,#80c7c2);">SY</button>
    </div>
  </header>

  <!-- ============================ <EditorBody/> ============================ -->
  <div class="flex" style="height: calc(100vh - 3.5rem);">

    <!-- <ToolRail/> -->
    <div class="w-14 shrink-0 flex flex-col items-center gap-1 py-3 border-r border-line" style="background: var(--bar-bg);">
      <div class="tool active" title="선택"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 7.5 18 2.5-7.5L20.5 11z"/></svg></div>
      <div class="tool" title="이동/팬"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.6-2.5L2.4 15"/></svg></div>
      <div class="tool" title="벽 편집"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l9-5 9 5v13M3 13h18M9 21v-6h6v6"/></svg></div>
      <div class="tool" title="문·창 개구부"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M14 12h.01"/></svg></div>
      <div class="tool" title="가구"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4M3 11a2 2 0 0 0-2 2v4h22v-4a2 2 0 0 0-2-2M3 11h18M5 21v-4M19 21v-4"/></svg></div>
      <div class="tool" title="측정"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg></div>
      <div class="mt-auto tool" title="메모"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
    </div>

    <!-- <LibraryPanel/> -->
    <aside class="w-60 shrink-0 flex flex-col border-r border-line" style="background: var(--bar-bg);">
      <div class="px-3.5 h-11 flex items-center gap-2 border-b border-line">

        <span class="ml-auto text-dim"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      </div>
      <div class="px-3 py-2 flex gap-1.5 overflow-x-auto border-b border-line text-[12px] font-bold">
        <button class="h-7 px-2.5 rounded-md text-main shrink-0" style="background:var(--surface-hi)">전체</button>
        <button class="h-7 px-2.5 rounded-md text-dim hover:text-main shrink-0">침대</button>
        <button class="h-7 px-2.5 rounded-md text-dim hover:text-main shrink-0">소파</button>
        <button class="h-7 px-2.5 rounded-md text-dim hover:text-main shrink-0">테이블</button>
        <button class="h-7 px-2.5 rounded-md text-dim hover:text-main shrink-0">수납</button>
      </div>
      <div class="p-3 grid grid-cols-2 gap-2 overflow-y-auto" id="library"></div>
      <div class="mt-auto px-3.5 py-2.5 border-t border-line text-[11px] text-dim flex items-center gap-1.5">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l3 3 3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
        끌어다 캔버스에 배치
      </div>
    </aside>

    <!-- <CanvasArea/> -->
    <div class="flex-1 min-w-0 flex flex-col">
      <!-- canvas toolbar -->
      <div class="h-11 shrink-0 flex items-center gap-2 px-3 border-b border-line" style="background: var(--bar-bg);">
        <!-- 2D/3D toggle -->
        <div class="flex p-0.5 rounded-lg border border-line bg-surface text-[12.5px] font-bold">
          <button id="m3d" class="h-7 px-3 rounded-md inline-flex items-center gap-1.5"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5"/></svg>3D</button>
          <button id="m2d" class="h-7 px-3 rounded-md inline-flex items-center gap-1.5"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M9 3v18M3 9h18"/></svg>2D 평면도</button>
        </div>
        <span class="w-px h-5 bg-line mx-1"></span>
        <button class="tool !w-8 !h-8" title="실행 취소"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7L3 9"/></svg></button>
        <button class="tool !w-8 !h-8" title="다시 실행"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7l3 3"/></svg></button>
        <div class="ml-auto flex items-center gap-2 text-[12px] text-dim">
          <button class="tool !w-8 !h-8" title="축소"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
          <span class="font-bold text-muted tabular-nums">100%</span>
          <button class="tool !w-8 !h-8" title="확대"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
          <span class="inline-flex items-center gap-1.5 font-semibold"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>스냅</span>
          <span class="w-px h-5 bg-line mx-1"></span>
          <button class="inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border border-line bg-surface text-[12px] font-bold text-main hover:bg-surface-hi transition-colors" title="현재 2D 평면도를 PNG 이미지로 저장">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>이미지로 내보내기
          </button>
        </div>
      </div>

      <!-- canvas -->
      <div class="flex-1 relative" style="background: var(--canvas);" id="stage">
        <!-- 3D -->
        <div id="view3d" class="absolute inset-0"><canvas id="rfcanvas" class="block w-full h-full"></canvas></div>
        <!-- 2D floor plan -->
        <div id="view2d" class="absolute inset-0 hidden grid place-items-center p-8">
          <svg viewBox="-40 -50 600 700" class="w-full h-full max-w-[760px]" font-family="var(--rf-sans)">
            <!-- grid -->
            <defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="rgba(143,180,255,.10)" stroke-width="1"/></pattern></defs>
            <rect x="-40" y="-50" width="600" height="700" fill="url(#g)"/>
            <!-- room walls -->
            <rect x="0" y="0" width="520" height="600" fill="rgba(143,180,255,.04)" stroke="var(--text-muted)" stroke-width="6"/>
            <!-- window (right wall) -->
            <line x1="520" y1="105" x2="520" y2="335" stroke="var(--accent)" stroke-width="7"/>
            <line x1="513" y1="105" x2="513" y2="335" stroke="var(--accent)" stroke-width="2" opacity="0.6"/>
            <!-- door (left-front) -->
            <path d="M0 450 A100 100 0 0 1 100 550" fill="none" stroke="var(--text-dim)" stroke-width="1.5"/>
            <line x1="0" y1="450" x2="0" y2="550" stroke="var(--canvas)" stroke-width="8"/>
            <!-- furniture -->
            <g stroke-width="2" font-size="13" font-weight="700">
              <!-- desk (left) -->
              <rect x="12" y="120" width="58" height="170" rx="6" fill="rgba(255,255,255,.05)" stroke="var(--text-dim)"/>
              <text x="41" y="210" fill="var(--text-dim)" text-anchor="middle" transform="rotate(-90 41 210)">책상</text>
              <!-- nightstands -->
              <rect x="120" y="22" width="48" height="42" rx="5" fill="rgba(255,255,255,.05)" stroke="var(--text-dim)"/>
              <rect x="352" y="22" width="48" height="42" rx="5" fill="rgba(255,255,255,.05)" stroke="var(--text-dim)"/>
              <!-- dresser (right-front) -->
              <rect x="455" y="285" width="52" height="170" rx="6" fill="rgba(255,255,255,.05)" stroke="var(--text-dim)"/>
              <text x="481" y="372" fill="var(--text-dim)" text-anchor="middle" transform="rotate(-90 481 372)">수납</text>
              <!-- bed (selected) -->
              <rect x="150" y="60" width="230" height="270" rx="8" fill="rgba(143,180,255,.16)" stroke="var(--accent)" stroke-width="2.5"/>
              <line x1="150" y1="92" x2="380" y2="92" stroke="var(--accent)" stroke-width="2"/>
              <text x="265" y="205" fill="var(--accent)" text-anchor="middle">침대</text>
              <!-- selection handles -->
              <g fill="var(--accent)">
                <rect x="144" y="54" width="9" height="9" rx="2"/><rect x="377" y="54" width="9" height="9" rx="2"/>
                <rect x="144" y="324" width="9" height="9" rx="2"/><rect x="377" y="324" width="9" height="9" rx="2"/>
              </g>
            </g>
            <!-- dimensions -->
            <g stroke="var(--text-dim)" stroke-width="1" fill="var(--text-muted)" font-size="13" font-weight="700">
              <line x1="0" y1="-20" x2="520" y2="-20"/><text x="260" y="-26" text-anchor="middle">5.2 m</text>
              <line x1="-22" y1="0" x2="-22" y2="600"/><text x="-26" y="300" text-anchor="middle" transform="rotate(-90 -26 300)">6.0 m</text>
            </g>
          </svg>
        </div>

        <!-- floating selection badge (3D) -->
        <div id="selBadge" class="absolute top-4 left-1/2 -translate-x-1/2 inline-flex items-center gap-2 h-8 px-3 rounded-lg text-[12px] font-bold text-white border" style="background:rgba(5,7,12,.6);backdrop-filter:blur(8px);border-color:rgba(143,180,255,.4)">
          <span class="w-1.5 h-1.5 rounded-full" style="background:var(--accent)"></span>침대 선택됨 · 드래그로 회전
        </div>
      </div>
    </div>

    <!-- <Inspector/> -->
    <aside class="w-72 shrink-0 flex flex-col border-l border-line overflow-y-auto" style="background: var(--bar-bg);">
      <div class="px-4 h-11 flex items-center gap-2 border-b border-line">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M3 11V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4M3 11a2 2 0 0 0-2 2v4h22v-4a2 2 0 0 0-2-2M3 11h18"/></svg>
        <h2 class="text-[13px] font-bold text-main">침대</h2>
        <span class="ml-auto text-[11px] font-bold text-dim">가구</span>
      </div>

      <div class="p-4 flex flex-col gap-4">
        <div>
          <p class="text-[11px] font-bold text-dim mb-2">치수</p>
          <div class="grid grid-cols-3 gap-2">
            <label class="fld"><span class="u">W</span><input value="2.30" /><span class="u">m</span></label>
            <label class="fld"><span class="u">D</span><input value="2.75" /><span class="u">m</span></label>
            <label class="fld"><span class="u">H</span><input value="0.55" /><span class="u">m</span></label>
          </div>
        </div>
        <div>
          <p class="text-[11px] font-bold text-dim mb-2">위치 · 회전</p>
          <div class="grid grid-cols-3 gap-2">
            <label class="fld"><span class="u">X</span><input value="0.00" /></label>
            <label class="fld"><span class="u">Y</span><input value="-1.40" /></label>
            <label class="fld"><span class="u">∠</span><input value="0" /><span class="u">°</span></label>
          </div>
        </div>
        <div>
          <p class="text-[11px] font-bold text-dim mb-2">재질</p>
          <div class="grid grid-cols-5 gap-2">
            <button class="aspect-square rounded-lg border-2" style="background:#2a2a30;border-color:var(--accent)"></button>
            <button class="aspect-square rounded-lg border border-line" style="background:#6b6f78"></button>
            <button class="aspect-square rounded-lg border border-line" style="background:#b9bac2"></button>
            <button class="aspect-square rounded-lg border border-line" style="background:#7a5b46"></button>
            <button class="aspect-square rounded-lg border border-line" style="background:#3f6b46"></button>
          </div>
          <p class="mt-2 text-[12px] text-muted">다크 패브릭</p>
        </div>
        <div class="h-px bg-line"></div>
        <div class="grid grid-cols-2 gap-2">
          <button class="inline-flex items-center justify-center gap-1.5 h-9 rounded-lg border border-line bg-surface text-[12.5px] font-bold text-main hover:bg-surface-hi transition-colors"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>복제</button>
          <button class="inline-flex items-center justify-center gap-1.5 h-9 rounded-lg border text-[12.5px] font-bold transition-colors" style="border-color:rgba(240,114,106,.35);color:#f0726a"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>삭제</button>
        </div>
      </div>

      <!-- room info -->
      <div class="mt-auto p-4 border-t border-line">
        <p class="text-[11px] font-bold text-dim mb-2.5">공간 정보</p>
        <dl class="grid grid-cols-2 gap-y-2 text-[12.5px]">
          <dt class="text-dim">방 크기</dt><dd class="text-main font-semibold text-right">5.2 × 6.0 m</dd>
          <dt class="text-dim">천장 높이</dt><dd class="text-main font-semibold text-right">2.8 m</dd>
          <dt class="text-dim">바닥 면적</dt><dd class="text-main font-semibold text-right">31.2 m²</dd>
          <dt class="text-dim">배치 가구</dt><dd class="text-main font-semibold text-right">6</dd>
        </dl>
      </div>
    </aside>
  </div>

  <script src="../../assets/vendor/three.min.js"></script>
  <script>
  // ===== <PipelineProgress current="editor"/> =====
  (function () {
    var PIPE = [
      { k: 'source', label: '소스', href: 'source.html' }, { k: 'status', label: '재구성', href: 'status.html' },
      { k: 'editor', label: '편집', href: 'editor.html' },
    ];
    var st = { source: 'done', status: 'done', editor: 'active' }, CUR = 'editor';
    var el = document.getElementById('pipeline'); if (!el) return;
    function circ(s) { return s === 'done' ? 'background:rgba(72,211,154,.16);color:#48d39a;border-color:rgba(72,211,154,.4)' : s === 'active' ? 'background:rgba(143,180,255,.16);color:var(--accent);border-color:rgba(143,180,255,.5)' : 'background:var(--surface);color:var(--text-dim);border-color:var(--line-soft)'; }
