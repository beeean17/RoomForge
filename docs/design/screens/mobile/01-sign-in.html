<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>01 · Sign In — RoomForge (Mobile)</title>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <link rel="stylesheet" href="../../system/base.css" />
  <style>
    /* Phone frame so the dedicated mobile design reads as a device. */
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .device {
      width: 390px; max-width: 100%; height: 844px; max-height: 92vh;
      border-radius: 46px; padding: 12px; background: #050505;
      box-shadow: var(--rf-shadow-pop); position: relative;
    }
    .screen {
      position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden;
      background: var(--rf-grad-brand);
      display: flex; flex-direction: column;
    }
    .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 124px; height: 28px; border-radius: 999px; background: #050505; z-index: 5; }

    .hero {
      position: relative; flex: 1; padding: 64px 26px 24px; color: #fff; overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.10) 1px, transparent 1px);
      background-size: 30px 30px; mask-image: radial-gradient(400px 360px at 60% 70%, #000, transparent 78%); opacity: 0.5;
    }
    .hero > * { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
    .brand .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--rf-grad-brand); box-shadow: var(--rf-ring-inset); }
    .hl { font-size: 30px; line-height: 1.08; letter-spacing: 0; margin: 40px 0 12px; }
    .sub { color: rgba(255,255,255,0.86); font-size: 14px; }
    .miniplan { margin-top: 26px; height: 150px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); backdrop-filter: blur(6px); position: relative; }
    .miniplan .pl { position: absolute; inset: 22px; border: 2.5px solid rgba(220,232,255,0.9); border-radius: 7px; }
    .miniplan .bd { position: absolute; left: 28%; top: 26%; width: 30%; height: 30%; border-radius: 5px; background: rgba(143,180,255,0.26); border: 2px solid rgba(143,180,255,0.86); animation: rf-float 5s var(--rf-ease-standard) infinite; }
    @keyframes rf-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .miniplan .bd { animation: none; } }

    /* Bottom sheet = the auth surface */
    .sheet {
      background: var(--rf-surface); border-radius: 8px 8px 28px 28px;
      padding: 26px 24px calc(28px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(0,0,0,0.18);
      animation: rf-sheet-up var(--rf-dur-4) var(--rf-ease-spring);
    }
    @keyframes rf-sheet-up { from { transform: translateY(40px); opacity: 0; } }
    .grab { width: 40px; height: 4px; border-radius: 999px; background: var(--rf-line-strong); margin: 0 auto 18px; }
    .sheet h2 { font-size: 21px; letter-spacing: 0; }
    .sheet .lead { color: var(--rf-muted); font-size: 14px; margin: 6px 0 20px; }
    .provider { width: 100%; min-height: 54px; gap: 12px; font-size: 15px; border-color: rgba(220,232,255,0.42); }
    .legal { margin-top: 16px; font-size: 11px; color: var(--rf-subtle); text-align: center; }
    .legal a { color: var(--rf-candidate); font-weight: 600; text-decoration: none; }
    .g-logo { width: 20px; height: 20px; filter: none; }
    .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; animation: rf-spin 0.7s linear infinite; }
    @keyframes rf-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="device">
    <div class="notch"></div>
    <main class="screen" role="main">
      <section class="hero">
        <div class="brand"><span class="mark"></span> RoomForge</div>
        <h1 class="hl">사진 한 장으로<br>시작하는 방 설계</h1>
        <p class="sub">올리면 방을 자동으로 재구성합니다.</p>
        <div class="miniplan" aria-hidden="true"><span class="pl"></span><span class="bd"></span></div>
      </section>

      <section class="sheet" aria-labelledby="m-title">
        <div class="grab"></div>
        <h2 id="m-title">로그인</h2>
        <p class="lead">마지막 작업부터 이어서 진행해요.</p>

        <div class="rf-notice rf-notice--error" role="alert" id="err" hidden style="margin-bottom:16px">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <div><strong>로그인이 완료되지 않았어요</strong>팝업 허용 후 다시 시도해 주세요.</div>
        </div>

        <button class="rf-btn provider" id="signin">
          <svg class="g-logo" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Google로 계속하기
        </button>
        <p class="legal">계속하면 <a href="#">약관</a> · <a href="#">개인정보 처리방침</a>에 동의합니다.</p>
      </section>
    </main>
  </div>

  <script src="../../system/motion.js"></script>
  <script>
    var btn = document.getElementById('signin'), err = document.getElementById('err'), original = btn.innerHTML;
    btn.addEventListener('click', function () {
      if (btn.dataset.busy) return; btn.dataset.busy = '1'; err.hidden = true;
      btn.innerHTML = '<span class="spin"></span> 로그인 중…';
      btn.style.background = 'var(--rf-grad-primary)'; btn.style.color = '#050505'; btn.style.borderColor = 'transparent';
      setTimeout(function () { btn.innerHTML = original; btn.style.cssText = ''; err.hidden = false; delete btn.dataset.busy; }, 1600);
    });
  </script>
</body>
</html>
