<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RoomForge — 가이드 촬영</title>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <style>
    :root { --accent:#8fb4ff; --ok:#48d39a; --ink:#f5f7fb; --dim:rgba(245,247,251,.6); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--rf-sans); color: var(--ink);
      background: #000; overflow: hidden;
      width: 100%; max-width: 480px; margin-inline: auto;
      position: relative;
    }
    .app { position: fixed; inset: 0; max-width: 480px; margin-inline: auto; }

    /* ---- live camera feed (simulated) ---- */
    .feed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.82) contrast(1.06) saturate(1.02); }
    .scrim { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.55), transparent 18%, transparent 62%, rgba(0,0,0,.72)); }

    /* ---- AR guide layer ---- */
    .ar { position: absolute; inset: 0; pointer-events: none; }
    .thirds { position: absolute; inset: 7% 5%; }
    .thirds::before, .thirds::after { content:""; position:absolute; inset:0; }
    .thirds::before { background:
      linear-gradient(90deg, transparent calc(33.3% - .5px), rgba(255,255,255,.14) 33.3%, transparent calc(33.3% + .5px)),
      linear-gradient(90deg, transparent calc(66.6% - .5px), rgba(255,255,255,.14) 66.6%, transparent calc(66.6% + .5px)); }
    .thirds::after { background:
      linear-gradient(180deg, transparent calc(33.3% - .5px), rgba(255,255,255,.14) 33.3%, transparent calc(33.3% + .5px)),
      linear-gradient(180deg, transparent calc(66.6% - .5px), rgba(255,255,255,.14) 66.6%, transparent calc(66.6% + .5px)); }
    /* detected-surface accent brackets (AR feel) */
    .bracket { position:absolute; width:34px; height:34px; border:2px solid rgba(143,180,255,.85); filter: drop-shadow(0 0 6px rgba(143,180,255,.5)); }
    .b1 { top:30%; left:14%; border-right:0; border-bottom:0; border-top-left-radius:6px; }
    .b2 { top:30%; right:14%; border-left:0; border-bottom:0; border-top-right-radius:6px; }
    .b3 { bottom:32%; left:14%; border-right:0; border-top:0; border-bottom-left-radius:6px; }
    .b4 { bottom:32%; right:14%; border-left:0; border-top:0; border-bottom-right-radius:6px; }
    /* center lock reticle */
    .reticle { position:absolute; top:50%; left:50%; width:74px; height:74px; transform:translate(-50%,-50%); }
    .reticle .ring { position:absolute; inset:0; border:2px solid rgba(72,211,154,.95); border-radius:50%; box-shadow:0 0 0 4px rgba(72,211,154,.12), 0 0 16px rgba(72,211,154,.4); }
    .reticle .dot { position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background:var(--ok); transform:translate(-50%,-50%); }
    /* horizon level */
    .level { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; }
    .level .seg { width:46px; height:2px; border-radius:2px; background:rgba(72,211,154,.9); box-shadow:0 0 8px rgba(72,211,154,.5); }
    .level .seg.l { margin-right:54px; } .level .seg.r { margin-left:54px; }

    /* ---- top bar ---- */
    .top { position:absolute; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 14px) 16px 10px; display:flex; align-items:center; gap:10px; }
    .ibtn { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(8,10,14,.5); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.14); }
    .ibtn svg { width:19px; height:19px; }
    .title { text-align:center; line-height:1.15; flex:1; }
    .title b { display:block; font-size:14px; font-weight:800; }
    .title span { display:block; font-size:11px; color:var(--dim); font-weight:700; }

    /* ---- angle minimap ---- */
    .map { position:absolute; top:calc(env(safe-area-inset-top) + 64px); right:14px; width:96px; padding:10px; border-radius:14px; background:rgba(8,10,14,.55); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14); text-align:center; }
    .map .room { position:relative; width:64px; height:64px; margin:0 auto; border:1.5px solid rgba(245,247,251,.4); border-radius:7px; }
    .map .d { position:absolute; width:9px; height:9px; border-radius:50%; transform:translate(-50%,-50%); background:rgba(245,247,251,.28); }
    .map .d.done { background:#fff; }
    .map .d.cur { background:var(--accent); box-shadow:0 0 0 4px rgba(143,180,255,.22); animation:pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 3px rgba(143,180,255,.22);} 50%{ box-shadow:0 0 0 7px rgba(143,180,255,.08);} }
    .map .lbl { margin-top:7px; font-size:11px; font-weight:800; } .map .lbl i { color:var(--accent); font-style:normal; }

    /* ---- coach + progress + controls ---- */
    .bottom { position:absolute; left:0; right:0; bottom:0; padding:0 18px calc(env(safe-area-inset-bottom) + 20px); }
    .coach { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto 14px; width:max-content; max-width:100%; padding:9px 14px; border-radius:999px; font-size:13px; font-weight:800; background:rgba(72,211,154,.16); color:#a8f0cf; border:1px solid rgba(72,211,154,.4); backdrop-filter:blur(8px); }
    .coach .led { width:7px; height:7px; border-radius:50%; background:var(--ok); }
    .seg8 { display:flex; gap:5px; margin:0 auto 18px; width:min(280px,100%); }
    .seg8 span { flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,.22); }
    .seg8 span.on { background:#fff; }
    .seg8 span.cur { background:var(--accent); box-shadow:0 0 8px rgba(143,180,255,.6); }
    .controls { display:flex; align-items:center; justify-content:space-between; }
    .thumb { width:52px; height:52px; border-radius:12px; object-fit:cover; border:2px solid rgba(255,255,255,.7); }
    .shutter { width:78px; height:78px; border-radius:50%; border:4px solid #fff; background:rgba(255,255,255,.12); display:grid; place-items:center; }
    .shutter i { width:58px; height:58px; border-radius:50%; background:#fff; display:block; transition:transform .1s; }
    .shutter:active i { transform:scale(.9); }
    .done { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(8,10,14,.5); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(8px); font-size:12px; font-weight:800; }
    .done svg { width:20px; height:20px; }
    @media (prefers-reduced-motion: reduce){ .map .d.cur { animation:none; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- live camera feed -->
    <img class="feed" src="../../assets/room.png" alt="" />
    <div class="scrim"></div>

    <!-- AR guide overlay -->
    <div class="ar">
      <div class="thirds"></div>
      <span class="bracket b1"></span><span class="bracket b2"></span><span class="bracket b3"></span><span class="bracket b4"></span>
      <div class="level"><span class="seg l"></span><span class="seg r"></span></div>
      <div class="reticle"><span class="ring"></span><span class="dot"></span></div>
    </div>

    <!-- top bar -->
    <div class="top">
      <a class="ibtn" href="project.html" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
      <div class="title"><b>거실 리노베이션</b><span>가이드 촬영</span></div>
      <button class="ibtn" aria-label="플래시"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg></button>
    </div>

    <!-- angle minimap -->
    <div class="map" aria-label="촬영 진행">
      <div class="room" id="room"></div>
      <div class="lbl"><i>6</i> / 8 각도</div>
    </div>

    <!-- coach + progress + controls -->
    <div class="bottom">
      <div class="coach"><span class="led"></span>정렬됨 · 이 각도에서 촬영하세요</div>
      <div class="seg8" id="seg8"></div>
      <div class="controls">
        <img class="thumb" src="../../assets/room.png" alt="최근 촬영" style="filter:brightness(.8)" />
        <button class="shutter" aria-label="촬영"><i></i></button>
        <a class="done" href="upload.html" aria-label="완료"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg></a>
      </div>
    </div>
  </div>

  <script>
    // angle minimap dots — 8 positions around the room (corners + edge mids), no compass labels
    (function () {
      var pos = [[50,0],[100,0],[100,50],[100,100],[50,100],[0,100],[0,50],[0,0]];
      var done = 6, cur = 6; // 0-indexed current = 7th slot
      var room = document.getElementById('room');
      pos.forEach(function (p, i) {
        var d = document.createElement('span');
        d.className = 'd' + (i < done ? ' done' : '') + (i === cur ? ' cur' : '');
        d.style.left = p[0] + '%'; d.style.top = p[1] + '%';
        room.appendChild(d);
      });
      var seg = document.getElementById('seg8'), h = '';
      for (var i = 0; i < 8; i++) h += '<span class="' + (i < done ? 'on' : (i === cur ? 'cur' : '')) + '"></span>';
      seg.innerHTML = h;
    })();
  </script>
</body>
</html>
