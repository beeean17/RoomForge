<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RoomForge — 거실 리노베이션</title>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <style>
    :root { --bg:#070608; --ink:#f6f7f9; --muted:rgba(246,247,249,.64); --dim:rgba(246,247,249,.42); --accent:#8fb4ff; --ok:#48d39a; --line:rgba(214,226,236,.12); --line2:rgba(214,226,236,.22); --surface:rgba(255,255,255,.045); --bar:rgba(10,9,12,.86); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:var(--rf-sans); color:var(--ink); background:var(--bg); max-width:480px; margin-inline:auto; padding-bottom:calc(env(safe-area-inset-bottom) + 84px); }
    .appbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 12px) 14px 12px; background:var(--bar); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
    .ic { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--ink); background:var(--surface); border:1px solid var(--line); }
    .ic svg { width:19px; height:19px; }
    .appbar .ttl { flex:1; text-align:center; font-size:15px; font-weight:800; }
    main { padding:16px; display:flex; flex-direction:column; gap:16px; }
    /* hero preview */
    .hero { position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:#0c0d10; }
    .hero img { width:100%; aspect-ratio:16/11; object-fit:cover; filter:saturate(.92) brightness(.85); display:block; }
    .hero .badge { position:absolute; top:12px; left:12px; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:9px; font-size:12px; font-weight:800; background:rgba(72,211,154,.2); color:#a8f0cf; border:1px solid rgba(72,211,154,.4); backdrop-filter:blur(8px); }
    .hero .play { position:absolute; inset:0; display:grid; place-items:center; }
    .hero .play span { width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:rgba(5,7,12,.5); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.3); }
    .hero .play svg { width:24px; height:24px; color:#fff; }
    .hero .cap { position:absolute; left:0; right:0; bottom:0; padding:14px; font-size:12px; font-weight:700; color:rgba(255,255,255,.9); background:linear-gradient(transparent, rgba(3,4,6,.7)); }
    h1 { margin:0; font-size:24px; font-weight:800; }
    .sub { margin:5px 0 0; font-size:13px; color:var(--dim); display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    /* pipeline mini */
    .pipe { display:flex; align-items:center; gap:6px; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); }
    .pn { display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; }
    .pn .c { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; border:1px solid var(--line); }
    .pn .c svg { width:15px; height:15px; }
    .pn .t { font-size:11px; font-weight:800; }
    .pl { flex:1; height:2px; border-radius:2px; }
    /* card */
    .card { border-radius:16px; border:1px solid var(--line); background:var(--surface); padding:16px; }
    .card .ch { display:flex; align-items:center; gap:8px; }
    .card .ch h3 { margin:0; font-size:15px; font-weight:800; }
    .card .ch a { margin-left:auto; font-size:12.5px; font-weight:800; color:var(--accent); text-decoration:none; }
    .thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:13px; }
    .thumbs span { aspect-ratio:1; border-radius:9px; background-size:cover; background-position:center; }
    .thumbs .add { display:grid; place-items:center; border:1px dashed var(--line2); color:var(--dim); }
    .thumbs .add svg { width:18px; height:18px; }
    .handoff { display:flex; align-items:flex-start; gap:12px; padding:15px; border-radius:16px; border:1px solid var(--line); background:linear-gradient(135deg, rgba(143,180,255,.08), transparent 60%), var(--surface); }
    .handoff .hi { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:none; background:rgba(143,180,255,.16); color:var(--accent); }
    .handoff .hi svg { width:19px; height:19px; }
    .handoff b { font-size:14px; font-weight:800; } .handoff p { margin:3px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5; }
    /* sticky bottom action */
    .actionbar { position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:480px; margin-inline:auto; display:flex; gap:10px; padding:12px 16px calc(env(safe-area-inset-bottom) + 14px); background:var(--bar); backdrop-filter:blur(16px); border-top:1px solid var(--line); }
    .btn { flex:1; height:50px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-weight:800; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
    .btn svg { width:18px; height:18px; }
    .btn.primary { border:0; color:#050505; background:var(--rf-grad-primary); }
  </style>
</head>
<body>
  <header class="appbar">
    <a class="ic" href="projects.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="ttl">거실 리노베이션</span>
    <button class="ic" aria-label="더보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>

  <main>
    <div>
      <h1>거실 리노베이션</h1>
      <p class="sub"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>재구성 완료</span> · 이미지 18 · 5.2 × 6.0 m</p>
    </div>

    <a class="hero" href="preview.html">
      <img src="../../assets/room.png" alt="" />
      <span class="badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>3D 준비됨</span>
      <span class="play"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg></span></span>
      <span class="cap">탭하여 3D 미리보기</span>
    </a>

    <!-- pipeline mini (mobile: edit happens on desktop) -->
    <div class="pipe">
      <div class="pn"><div class="c" style="background:rgba(72,211,154,.16);color:#48d39a;border-color:rgba(72,211,154,.4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg></div><div class="t">소스</div></div>
      <div class="pl" style="background:linear-gradient(90deg,#48d39a,var(--line2))"></div>
      <div class="pn"><div class="c" style="background:rgba(72,211,154,.16);color:#48d39a;border-color:rgba(72,211,154,.4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg></div><div class="t">재구성</div></div>
      <div class="pl" style="background:var(--line)"></div>
      <div class="pn"><div class="c" style="color:var(--dim)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5"/></svg></div><div class="t" style="color:var(--dim)">편집</div></div>
    </div>

    <!-- source images -->
    <div class="card">
      <div class="ch"><h3>소스 이미지</h3><span style="font-size:12.5px;color:var(--dim)">18장</span><a href="capture.html">+ 촬영</a></div>
      <div class="thumbs">
        <span style="background-image:url(../../assets/room.png);filter:brightness(.85)"></span>
        <span style="background-image:url(../../assets/room.png);filter:brightness(.7)"></span>
        <span style="background-image:url(../../assets/room.png);filter:brightness(.95)"></span>
        <a class="add" href="capture.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></a>
      </div>
    </div>

    <!-- desktop edit handoff -->
    <div class="handoff">
      <span class="hi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
      <div><b>정밀 편집은 데스크탑에서</b><p>벽·가구 보정과 평면도 편집은 데스크탑 에디터에서 더 정확합니다. 링크를 보내 이어서 작업하세요.</p></div>
    </div>
  </main>

  <div class="actionbar">
    <a class="btn" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>데스크탑 링크</a>
    <a class="btn primary" href="capture.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>가이드 촬영</a>
  </div>
</body>
</html>
