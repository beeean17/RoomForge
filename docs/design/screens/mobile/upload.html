<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RoomForge — 업로드</title>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <style>
    :root { --bg:#070608; --ink:#f6f7f9; --muted:rgba(246,247,249,.64); --dim:rgba(246,247,249,.42); --accent:#8fb4ff; --ok:#48d39a; --bad:#f0726a; --line:rgba(214,226,236,.12); --line2:rgba(214,226,236,.22); --surface:rgba(255,255,255,.045); --bar:rgba(10,9,12,.86); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:var(--rf-sans); color:var(--ink); background:var(--bg); max-width:480px; margin-inline:auto; padding-bottom:calc(env(safe-area-inset-bottom) + 84px); }
    .appbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 12px) 14px 12px; background:var(--bar); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
    .ic { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--ink); background:var(--surface); border:1px solid var(--line); }
    .ic svg { width:19px; height:19px; }
    .appbar .ttl { flex:1; text-align:center; font-size:15px; font-weight:800; }
    main { padding:18px; }
    /* progress ring */
    .ring-wrap { display:flex; flex-direction:column; align-items:center; padding:18px 0 8px; }
    .ring { position:relative; width:140px; height:140px; }
    .ring svg { transform:rotate(-90deg); }
    .ring .pct { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .ring .pct b { font-size:32px; font-weight:800; line-height:1; }
    .ring .pct span { font-size:12px; color:var(--dim); font-weight:700; margin-top:4px; }
    .head { text-align:center; margin-top:10px; }
    .head h1 { margin:0; font-size:19px; font-weight:800; }
    .head p { margin:6px 0 0; font-size:13px; color:var(--muted); }
    /* thumbs */
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:22px; }
    .it { position:relative; aspect-ratio:1; border-radius:11px; overflow:hidden; border:1px solid var(--line); }
    .it img { width:100%; height:100%; object-fit:cover; }
    .it .ov { position:absolute; inset:0; display:grid; place-items:center; background:rgba(5,7,12,.45); }
    .it .ov svg { width:18px; height:18px; }
    .it.up img { filter:brightness(.5); }
    .it.up .ring2 { width:26px; height:26px; }
    .it.done .ov { background:rgba(5,7,12,.2); }
    .it.fail .ov { background:rgba(240,114,106,.3); }
    .note { display:flex; align-items:center; gap:9px; margin-top:20px; padding:13px 14px; border-radius:13px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; color:var(--muted); }
    .note svg { width:16px; height:16px; color:var(--accent); flex:none; }
    .actionbar { position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:480px; margin-inline:auto; display:flex; gap:10px; padding:12px 16px calc(env(safe-area-inset-bottom) + 14px); background:var(--bar); backdrop-filter:blur(16px); border-top:1px solid var(--line); }
    .btn { flex:1; height:50px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-weight:800; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
    .btn.primary { border:0; color:#050505; background:var(--rf-grad-primary); }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spin { animation:spin 1s linear infinite; }
  </style>
</head>
<body>
  <header class="appbar">
    <a class="ic" href="project.html" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <span class="ttl">업로드</span>
    <span class="ic" style="opacity:0"></span>
  </header>

  <main>
    <div class="ring-wrap">
      <div class="ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="62" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
          <circle cx="70" cy="70" r="62" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="148" />
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fb4ff"/><stop offset="1" stop-color="#80c7c2"/></linearGradient></defs>
        </svg>
        <div class="pct"><b>62%</b><span>5 / 8</span></div>
      </div>
      <div class="head"><h1>사진 업로드 중</h1><p>8장 중 5장 완료 · 잠시만요</p></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg> 업로드가 끝나면 자동으로 재구성이 시작됩니다.</div>
  </main>

  <div class="actionbar">
    <a class="btn" href="projects.html">백그라운드로</a>
    <a class="btn primary" href="project.html">완료</a>
  </div>

  <script>
    (function () {
      // states: done, up (uploading), fail, queued
      var items = ['done','done','done','done','done','up','queued','queued'];
      var spinner = '<svg class="spin" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8fb4ff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
      var check = '<svg viewBox="0 0 24 24" fill="none" stroke="#48d39a" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';
      var dot = '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(246,247,249,.5)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5"/></svg>';
      document.getElementById('grid').innerHTML = items.map(function (s, i) {
        var ov = s === 'up' ? spinner : s === 'done' ? check : dot;
        var cls = s === 'done' ? 'done' : s === 'up' ? 'up' : '';
        var show = s === 'done' ? '' : ('<div class="ov">' + ov + '</div>');
        return '<div class="it ' + cls + '"><img src="../../assets/room.png" style="filter:brightness(' + (0.6 + (i % 3) * 0.12) + ')" alt="" />' +
          (s === 'done' ? '<div class="ov" style="background:transparent"><span style="position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:#48d39a;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#04140d" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span></div>' : show) +
          '</div>';
      }).join('');
    })();
  </script>
</body>
</html>
