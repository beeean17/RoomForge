<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>02 · Project Workspace — RoomForge (Mobile)</title>
  <link rel="stylesheet" href="../../system/tokens.css" />
  <link rel="stylesheet" href="../../system/base.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .device { width: 390px; max-width: 100%; height: 844px; max-height: 92vh; border-radius: 46px; padding: 12px; background: #050505; box-shadow: var(--rf-shadow-pop); }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--rf-paper); display: flex; flex-direction: column; }
    .statusbar { height: 44px; flex: none; }

    .appbar { display: flex; align-items: center; gap: 10px; padding: 4px 18px 12px; }
    .appbar .rf-brand { font-size: 17px; }
    .appbar .rf-brand-mark { width: 26px; height: 26px; }

    .scroll { flex: 1; overflow: auto; padding: 0 16px 120px; -webkit-overflow-scrolling: touch; }
    .searchbar { position: relative; margin-bottom: 12px; }
    .searchbar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--rf-subtle); }
    .searchbar input { padding-left: 36px; min-height: 44px; }

    .filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .fchip { white-space: nowrap; cursor: pointer; min-height: 32px; }
    .fchip[aria-pressed="true"] { background: var(--rf-candidate); color: #050505; border-color: var(--rf-candidate); }

    .plist { display: grid; gap: 12px; }
    .pcard { padding: 12px; display: grid; grid-template-columns: 76px 1fr; gap: 13px; align-items: center; }
    .thumb { width: 76px; height: 64px; border-radius: var(--rf-radius-sm); position: relative; background: var(--rf-canvas); border: 1px solid var(--rf-line); overflow: hidden; }
    .thumb .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--rf-grid) 1px, transparent 1px), linear-gradient(90deg, var(--rf-grid) 1px, transparent 1px); background-size: 11px 11px; }
    .thumb .out { position: absolute; inset: 12px; border: 2px solid var(--rf-ink); border-radius: 3px; background: rgba(220,232,255,0.28); }
    .pmeta h3 { font-size: 15px; margin-bottom: 5px; }
    .pmeta .sub { color: var(--rf-muted); font-size: 12px; }
    .pmeta .chiprow { margin-top: 7px; }

    /* FAB */
    .fab {
      position: absolute; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 10;
      width: 58px; height: 58px; border-radius: 8px; border: 0; cursor: pointer;
      background: var(--rf-grad-primary); color: #050505; display: grid; place-items: center;
      box-shadow: 0 16px 36px rgba(143,180,255,0.22), var(--rf-ring-inset);
      transition: transform var(--rf-dur-1) var(--rf-ease-spring);
    }
    .fab:active { transform: scale(0.92); }
    .fab svg { width: 26px; height: 26px; }

    /* Bottom nav */
    .botnav { display: flex; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--rf-line); background: var(--rf-glass); backdrop-filter: var(--rf-glass-blur); }
    .botnav a { flex: 1; display: grid; justify-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--rf-subtle); text-decoration: none; }
    .botnav a.active { color: var(--rf-candidate); }
    .botnav svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="device">
    <main class="screen">
      <div class="statusbar"></div>
      <header class="appbar">
        <div class="rf-brand"><span class="rf-brand-mark"></span> RoomForge</div>
        <div class="rf-spacer"></div>
        <div class="rf-avatar" style="width:32px;height:32px">SY</div>
      </header>

      <div class="scroll">
        <div class="searchbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="rf-input" type="search" placeholder="이름·상태로 검색" aria-label="검색" />
        </div>

        <div class="filters" role="group" aria-label="상태 필터">
          <button class="rf-chip fchip" aria-pressed="true">전체</button>
          <button class="rf-chip fchip rf-chip--save"><span class="dot"></span>처리 중</button>
          <button class="rf-chip fchip rf-chip--warning"><span class="dot"></span>검토 필요</button>
          <button class="rf-chip fchip rf-chip--confirmed"><span class="dot"></span>완료</button>
        </div>

        <div class="plist" data-stagger>
          <article class="rf-card rf-card--interactive rf-card--selected pcard" tabindex="0">
            <div class="thumb"><span class="grid"></span><span class="out"></span></div>
            <div class="pmeta">
              <h3>침실 — 리모델링 A안</h3>
              <div class="sub">3.6 × 4.2 m · 가구 5 · 방금</div>
              <div class="chiprow"><span class="rf-chip rf-chip--confirmed"><span class="dot"></span>완료</span></div>
            </div>
          </article>
          <article class="rf-card rf-card--interactive pcard" tabindex="0">
            <div class="thumb"><span class="grid"></span><span class="out"></span></div>
            <div class="pmeta">
              <h3>거실 — 소파 배치</h3>
              <div class="sub">5.1 × 3.8 m · 가구 3 · 12분 전</div>
              <div class="chiprow"><span class="rf-chip rf-chip--save rf-chip--live"><span class="dot"></span>처리 중</span></div>
            </div>
          </article>
          <article class="rf-card rf-card--interactive pcard" tabindex="0">
            <div class="thumb"><span class="grid"></span><span class="out"></span></div>
            <div class="pmeta">
              <h3>작업실 — 책상 2개</h3>
              <div class="sub">2.8 × 3.0 m · 가구 2 · 어제</div>
              <div class="chiprow"><span class="rf-chip rf-chip--warning"><span class="dot"></span>검토 필요</span></div>
            </div>
          </article>
          <article class="rf-card rf-card--interactive pcard" tabindex="0">
            <div class="thumb"><span class="grid"></span><span class="out"></span></div>
            <div class="pmeta">
              <h3>현관 수납 정리</h3>
              <div class="sub">1.6 × 2.2 m · 가구 1 · 3일 전</div>
              <div class="chiprow"><span class="rf-chip"><span class="dot"></span>초안</span></div>
            </div>
          </article>
        </div>
      </div>

      <button class="fab" id="fab" aria-label="새 프로젝트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></button>

      <nav class="botnav" aria-label="주요 메뉴">
        <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>프로젝트</a>
        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>템플릿</a>
        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>계정</a>
      </nav>
    </main>
  </div>

  <script src="../../system/motion.js"></script>
  <script>
    document.getElementById('fab').addEventListener('click', function(){ rfToast('새 프로젝트 만들기'); });
    document.querySelectorAll('.fchip').forEach(function(c){ c.addEventListener('click', function(){
      document.querySelectorAll('.fchip').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      c.setAttribute('aria-pressed','true');
    });});
  </script>
</body>
</html>
