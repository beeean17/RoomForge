[project]
name = "roomforge-server"
version = "0.1.0"
description = "Lightweight FastAPI API for RoomForge."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "oracledb>=2.5.0",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
