<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="application-name" content="RoomForge" />
    <link rel="icon" type="image/png" href="/assets/app_icon.png" />
    <link rel="apple-touch-icon" href="/assets/app_icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>RoomForge</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rf-theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
